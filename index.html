<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Jarvis - 개인용 생산성 도구</title></head><body style="font-family:sans-serif;max-width:640px;margin:3rem auto;padding:0 1rem;line-height:1.7"><h1>Jarvis</h1><p>Jarvis는 개발자 본인 한 명이 사용하는 개인용 생산성 도구입니다. Discord로 보낸 메모, 링크, 할 일, 일정 요청을 정리해서 본인의 Notion, Google Tasks, Google Calendar에 저장합니다.</p><h2>Google 데이터 사용</h2><ul><li>Google Tasks: 본인 계정의 할 일을 만들고 상태를 확인합니다.</li><li>Google Calendar: 본인이 소유한 캘린더의 일정을 만들고 수정합니다.</li></ul><p>이 앱은 일반에 공개되어 있지 않으며 다른 사용자에게 제공되지 않습니다.</p><p><a href="privacy.html">개인정보처리방침</a></p></body></html>
